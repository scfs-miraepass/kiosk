<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>연결 끊김 · 미래카페</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f1f5f9;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px;
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-sizing: border-box;
      }
      svg { height: 48px; }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { margin: 0; color: #64748b; font-size: 15px; line-height: 1.6; }
      button {
        margin-top: 24px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: #0068b7;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- 오프라인에서도 보이도록 로고를 인라인으로 둔다 (public/favicon.svg) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.71 257" aria-hidden="true">
        <path d="m0 0 .71 257h81.74l-.74-176L0 0z" fill="#003e9c" />
        <path d="M0 0h176.71l79 81h-174" fill="#0068bb" />
        <path d="M255.71 0h82v81h-82z" fill="#ffb700" />
        <path d="M255.69 81 82.45 257h92.26" fill="#8ed3f5" />
        <path d="m255.69 81 1.03 176h-83.67" fill="#00a9ee" />
        <path d="m255.69 81 82.02 81.48V257h-80.99" fill="#0068b7" />
      </svg>
      <h1>카페 서버에 연결할 수 없어요</h1>
      <p>와이파이 연결을 확인한 뒤 다시 시도해 주세요.<br />연결되면 자동으로 주문 화면으로 돌아가요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
