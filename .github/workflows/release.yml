name: Docker Image Release

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      manual_version:
        description: '수동으로 빌드와 릴리즈를 진행할 때, 버전을 지정합니다. 값을 넣을 경우 semantic-release를 스킵합니다.'
        required: false
        type: string

env:
  IMAGE_PREFIX: ghcr.io/scfs-miraepass/kiosk

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # rebase-dev job이 봇으로 dev에 강제 푸시한 경우에는 새 사전 릴리스를 만들지 않습니다.
    # (semantic-release·수동 릴리스의 봇 푸시는 강제 푸시가 아니므로 여기에 걸리지 않습니다.)
    if: ${{ !inputs.manual_version && !(github.ref == 'refs/heads/dev' && github.event.forced && endsWith(github.actor, '[bot]')) }}
    outputs:
      new_version: ${{ steps.extract.outputs.NEW_VERSION }}
      firmware_version: ${{ steps.extract.outputs.FIRMWARE_VERSION }}
    steps:
      # 브랜치 규칙을 우회할 수 있는 GitHub App 토큰으로 릴리스 커밋을 푸시합니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # 릴리스 커밋 작성자를 App 봇 계정으로 표시하기 위해 이름과 noreply 이메일을 만듭니다.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'


      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          touch build.env
          yarn semantic-release

      # 펌웨어(scripts/kiosk-device)는 클라이언트와 따로 버전을 올립니다 (펌웨어 파일이 바뀐 커밋이 있을 때만).
      # 태그 firmware-vX.Y.Z만 만들고, 기기는 이 태그에서 업데이트를 받습니다. 설정은 release.config.mjs 참고.
      - name: Run semantic-release (firmware)
        env:
          RELEASE_TARGET: firmware
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          touch firmware.env
          # 펌웨어 태그가 하나도 없으면(처음 한 번) 지금까지 기기에 배포된 버전(VERSION 파일)을 첫 태그로 남겨 그 뒤로 이어서 올립니다.
          # 없으면 semantic-release가 1.0.0부터 시작해, 이미 더 높은 버전이 설치된 기기가 업데이트를 받지 못합니다.
          if [ -z "$(git tag --list 'firmware-v*')" ]; then
            BASE=$(git log -1 --format=%H -- scripts/kiosk-device/VERSION)
            SEED=$(git show "$BASE:scripts/kiosk-device/VERSION" | tr -d '[:space:]')
            git tag "firmware-v$SEED" "$BASE"
            git push origin "refs/tags/firmware-v$SEED"
            echo "[펌웨어] 첫 태그 firmware-v$SEED 를 $(git rev-parse --short "$BASE")에 만들었습니다."
          fi
          yarn semantic-release

      - name: Export version variable
        id: extract
        run: |
          source build.env
          source firmware.env
          echo "NEW_VERSION=${NEW_VERSION:-}" >> "$GITHUB_OUTPUT"
          echo "FIRMWARE_VERSION=${FIRMWARE_VERSION:-}" >> "$GITHUB_OUTPUT"

  manual-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.manual_version }}
    outputs:
      version: ${{ inputs.manual_version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      # 브랜치 규칙을 우회할 수 있는 GitHub App 토큰으로 릴리스 커밋을 푸시합니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # 릴리스 커밋 작성자를 App 봇 계정으로 표시하기 위해 이름과 noreply 이메일을 만듭니다.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create release commit and tag
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.manual_version }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: node .github/scripts/manual-release.mjs

      - name: Create GitHub Release
        if: ${{ steps.release.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
        run: |
          PRERELEASE=""
          case "$MANUAL_VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$MANUAL_VERSION" --verify-tag --title "v$MANUAL_VERSION" --notes-file release-notes.md $PRERELEASE

  # master에 버전 커밋이 올라오면(semantic-release, 수동 릴리스 모두) dev를 master 위로 rebase합니다.
  rebase-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [semantic-release, manual-release]
    if: ${{ always() && github.ref == 'refs/heads/master' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.manual-release.outputs.created == 'true' || needs.semantic-release.outputs.new_version || needs.semantic-release.outputs.firmware_version) }}
    steps:
      # dev 브랜치 규칙을 우회해 강제 푸시할 수 있도록 GitHub App 토큰을 사용합니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # rebase로 다시 쓰이는 커밋의 committer를 App 봇 계정으로 표시합니다.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # 원래 커밋 작성자(author)는 유지되고 committer만 봇으로 바뀝니다.
      - name: Rebase dev onto master
        env:
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: bash .github/scripts/rebase.sh dev master

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [semantic-release, manual-release]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.manual-release.outputs.version || needs.semantic-release.outputs.new_version) }}
    env:
      VERSION: ${{ needs.manual-release.outputs.version || needs.semantic-release.outputs.new_version }}
    steps:
      # 릴리스 커밋의 버전이 이미지에 들어가도록 새 태그를 체크아웃합니다.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=kiosk
          cache-to: type=gha,mode=max,scope=kiosk
